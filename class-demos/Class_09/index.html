<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> Class 9 </title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- divs are dividing elments and we use them to group -->
	<div class="container">

	<div class="grid-item">
		item 1
	</div>

	<div class="grid-item">
		item 2
	</div>

	<div class="grid-item">
		item 3
	</div>

	<div class="grid-item">
		item 4
	</div>

	<div class="grid-item">
		item 5
	</div>

	<div class="grid-item">
		item 6
	</div>


	<!-- putting the text in a span so it hides when i want the content  -->
	<div class="grid-item hidden">
		<span> item 7 </span>
	</div>

	<div class="grid-item hidden">
		<span> item 8 </span>
	</div>

	<div class="grid-item hidden">
		<span> item 9 </span>
	</div>

	<div class="grid-item positioned">
		item 10
	</div>
</div>
</body>
</html>
